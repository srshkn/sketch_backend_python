name: tests

on:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_postgresql
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d meeting_rooms_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PROJECT_NAME: test_sketch_backend_python
      PROJECT_DESCRIPTION: test_project_description
      PROJECT_VERSION: 1.0.0
      API_V1_STR: /test_api/v1

      POSTGRES_SERVER: 127.0.0.1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: test_postgresql

      JWT_SECRET: jwt_secret
      JWT_ALGORITHM: jwt_algorithm
      JWT_EXPIRE_MINUTES: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest -vv -s --maxfail=1